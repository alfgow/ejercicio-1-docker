services:
  db:
    image: postgres:14.24-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    image: node:trixie-slim
    working_dir: /app
    volumes:
      - ./app:/app
    command: ["node", "index.js"]
    depends_on:
        db:
            condition: service_healthy
    healthcheck:
        test: ["CMD", "node", "/app/healthcheck.js"]
        interval: 10s
        timeout: 5s
        retries: 5
  nginx:
    image: nginx:1.30.4-trixie-perl
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app